limit_req_zone $binary_remote_addr zone=shamrai_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=shamrai_public_read:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=shamrai_auth:10m rate=40r/m;
limit_req_zone $binary_remote_addr zone=shamrai_auth_poll:10m rate=90r/m;
limit_req_zone $binary_remote_addr zone=shamrai_payment:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=shamrai_webhook:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=shamrai_admin:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=shamrai_upload:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=shamrai_conn:10m;

server {
    listen 8080;
    server_name localhost;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn shamrai_conn 40;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 20s;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;
    # Brotli requires ngx_brotli in the runtime image. Keep gzip as the safe
    # fallback for nginx:stable-alpine; see deploy/nginx/brotli.conf.example.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri =404;
    }

    location ^~ /brand/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri =404;
    }

    location ^~ /bookmakers/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri =404;
    }

    location ^~ /sports/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, max-age=60" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri =404;
    }

    location = /service-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri =404;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|mp4|png|svg|webm|webp|woff2?)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
    }

    location ~ ^/api/(telegram/webhook|vk/callback|payments/(yookassa/webhook|tegro/webhook|telegram-webhook))$ {
        limit_req zone=shamrai_webhook burst=60 nodelay;
        client_max_body_size 1m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/auth/telegram/bot-session/ {
        limit_req zone=shamrai_auth_poll burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/auth/(login|telegram-widget|telegram/callback|telegram/bot-session|vk/(login|link)) {
        limit_req zone=shamrai_auth burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/(payments/(invoice|yookassa/create|tegro/create|promo/validate)|crowd-bets/[0-9]+/fund|bets/[0-9a-fA-F-]+/buy-hint|signals/stream-ticket) {
        limit_req zone=shamrai_payment burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/chat/(conversations/support/attachments|admin/conversations/[0-9a-fA-F-]+/attachments)$ {
        limit_req zone=shamrai_upload burst=5 nodelay;
        client_max_body_size 26m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
    }

    location ~ ^/api/(bets/with-coupon|admin/(announcements|forecast-broadcast|forecast-requests/bulk-send)) {
        limit_req zone=shamrai_upload burst=5 nodelay;
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
    }

    location = /api/admin/web-chat/stream {
        limit_req zone=shamrai_admin burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
    }

    location ~ ^/api/admin/ {
        limit_req zone=shamrai_admin burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
    }

    location ~ ^/api/(bookmakers|stats/global|bets/feed|bets/feed-page|health)$ {
        limit_req zone=shamrai_public_read burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /api {
        limit_req zone=shamrai_api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location ^~ /static/coupons/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri @backend_static;
    }

    location ^~ /static/chat/ {
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    location /static {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri @backend_static;
    }

    location @backend_static {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
