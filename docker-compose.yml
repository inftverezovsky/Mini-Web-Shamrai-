services:
  postgres:
    image: postgres:16-alpine
    container_name: shamrai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shamrai}
      POSTGRES_USER: ${POSTGRES_USER:-shamrai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shamrai

  redis:
    image: redis:7-alpine
    container_name: shamrai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shamrai

  backend:
    build:
      context: ./backend
    container_name: shamrai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG_MODE: ${DEBUG_MODE:-false}
      ALLOW_DEBUG_AUTH_BYPASS: ${ALLOW_DEBUG_AUTH_BYPASS:-false}
      SECURITY_RATE_LIMIT_MODE: ${SECURITY_RATE_LIMIT_MODE:-enforce}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shamrai}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-shamrai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CACHE_ENABLED: ${REDIS_CACHE_ENABLED:-true}
      REDIS_HOT_CACHE_TTL_SECONDS: ${REDIS_HOT_CACHE_TTL_SECONDS:-300}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-Shamra1_bot}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:support@shamra1.pro}
    volumes:
      - backend_static:/app/static
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    networks:
      - shamrai

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_ENABLE_DEBUG_AUTH: ${VITE_ENABLE_DEBUG_AUTH:-false}
        VITE_VK_ID_APP_ID: ${VITE_VK_ID_APP_ID:-}
        VITE_VK_ID_REDIRECT_URI: ${VITE_VK_ID_REDIRECT_URI:-}
        VITE_VK_GROUP_ID: ${VITE_VK_GROUP_ID:-}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-Shamra1_bot}
        VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${VITE_WEB_PUSH_VAPID_PUBLIC_KEY:-}
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
        VITE_PLAUSIBLE_ENDPOINT: ${VITE_PLAUSIBLE_ENDPOINT:-}
        VITE_PLAUSIBLE_CAPTURE_LOCALHOST: ${VITE_PLAUSIBLE_CAPTURE_LOCALHOST:-false}
    container_name: shamrai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8082}:8080"
    volumes:
      - backend_static:/usr/share/nginx/html/static:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shamrai

volumes:
  postgres_data:
  redis_data:
  backend_static:

networks:
  shamrai:
    driver: bridge
