        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri @backend_static;
    }

    location /static/ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://telegram.org https://*.telegram.org https://vk.com https://*.vk.com; connect-src 'self' https://shamra1.pro wss://shamra1.pro https://api.vk.com https://oauth.vk.com https://*.telegram.org https://plausible.io; frame-src https://t.me https://oauth.telegram.org https://vk.com https://*.vk.com; frame-ancestors 'self' https://web.telegram.org https://vk.com https://*.vk.com" always;
        try_files $uri @backend_static;
    }

    location @backend_static {
