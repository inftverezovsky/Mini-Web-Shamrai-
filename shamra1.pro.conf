# Compatibility entrypoint for older manual nginx setups.
#
# The canonical Shamrai public config is deploy/nginx/shamrai.conf. It serves
# the built frontend from /var/www/shamrai_web/dist and proxies only backend
# routes to the API. Keep this root-level file as a pointer so manual copies no
# longer route the whole public site to the Docker preview on :8082.
include /opt/shamrai-mini-app/deploy/nginx/shamrai.conf;
