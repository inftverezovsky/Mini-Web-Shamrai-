name: Restore drill

on:
  workflow_dispatch:
    inputs:
      artifact_source:
        description: Encrypted backup source
        required: true
        default: s3
        type: choice
        options:
          - vds
          - s3
      off_host_artifact_key:
        description: Optional exact S3 object key; blank selects the newest signed daily commit marker
        required: false
        type: string
  schedule:
    # 04:30 Europe/Moscow on Sundays, after the nightly backup window.
    - cron: "30 1 * * 0"

permissions:
  contents: read

jobs:
  restore-drill:
    name: Weekly encrypted backup restore drill
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    environment: shamrai-production-backup
    env:
      RESTORE_ARTIFACT_SOURCE: ${{ github.event_name == 'schedule' && 's3' || inputs.artifact_source }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate required restore secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHAMRAI_SSH_PRIVATE_KEY }}
          AGE_IDENTITY: ${{ secrets.SHAMRAI_BACKUP_AGE_IDENTITY }}
          S3_ACCESS_KEY_ID: ${{ secrets.SHAMRAI_BACKUP_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.SHAMRAI_BACKUP_S3_SECRET_ACCESS_KEY }}
          S3_AUDIT_ACCESS_KEY_ID: ${{ secrets.SHAMRAI_BACKUP_S3_AUDIT_ACCESS_KEY_ID }}
          S3_AUDIT_SECRET_ACCESS_KEY: ${{ secrets.SHAMRAI_BACKUP_S3_AUDIT_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.SHAMRAI_BACKUP_S3_BUCKET }}
          MANIFEST_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.SHAMRAI_BACKUP_MANIFEST_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing SHAMRAI_SSH_PRIVATE_KEY" >&2; exit 2; }
          test -n "$AGE_IDENTITY" || { echo "Missing SHAMRAI_BACKUP_AGE_IDENTITY" >&2; exit 2; }
          test -n "$MANIFEST_SIGNING_PUBLIC_KEY_BASE64" || { echo "Missing SHAMRAI_BACKUP_MANIFEST_SIGNING_PUBLIC_KEY_BASE64 variable" >&2; exit 2; }
          if [ "$RESTORE_ARTIFACT_SOURCE" = "s3" ]; then
            test -n "$S3_ACCESS_KEY_ID" || { echo "Missing SHAMRAI_BACKUP_S3_ACCESS_KEY_ID" >&2; exit 2; }
            test -n "$S3_SECRET_ACCESS_KEY" || { echo "Missing SHAMRAI_BACKUP_S3_SECRET_ACCESS_KEY" >&2; exit 2; }
            test -n "$S3_AUDIT_ACCESS_KEY_ID" || { echo "Missing SHAMRAI_BACKUP_S3_AUDIT_ACCESS_KEY_ID" >&2; exit 2; }
            test -n "$S3_AUDIT_SECRET_ACCESS_KEY" || { echo "Missing SHAMRAI_BACKUP_S3_AUDIT_SECRET_ACCESS_KEY" >&2; exit 2; }
            test -n "$S3_BUCKET" || { echo "Missing SHAMRAI_BACKUP_S3_BUCKET variable" >&2; exit 2; }
          fi

      - name: Install age and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age openssl

      - name: Prepare SSH and age identities
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHAMRAI_SSH_PRIVATE_KEY }}
          AGE_IDENTITY: ${{ secrets.SHAMRAI_BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/shamrai_restore_drill"
          chmod 0600 "$HOME/.ssh/shamrai_restore_drill"
          ssh-keyscan -p 22 -t ed25519 82.147.67.245 > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F "SHA256:xdVRtRaXWqK6eAIsE3VwD0o2H6GJDcCm65L1ZUBjuMw"
          printf '%s\n' "$AGE_IDENTITY" > "$RUNNER_TEMP/shamrai-backup-age-identity.txt"
          chmod 0600 "$RUNNER_TEMP/shamrai-backup-age-identity.txt"

      - name: Run restore drill from VDS
        if: ${{ env.RESTORE_ARTIFACT_SOURCE != 's3' }}
        shell: pwsh
        env:
          SHAMRAI_BACKUP_MANIFEST_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.SHAMRAI_BACKUP_MANIFEST_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          ./scripts/run-shamrai-restore-drill.ps1 `
            -Workspace "$env:GITHUB_WORKSPACE" `
            -SshKeyPath "$env:HOME/.ssh/shamrai_restore_drill" `
            -KnownHostsPath "$env:HOME/.ssh/known_hosts" `
            -NoHostKeyScan `
            -AgeIdentityPath "$env:RUNNER_TEMP/shamrai-backup-age-identity.txt"

      - name: Verify off-host client
        if: ${{ env.RESTORE_ARTIFACT_SOURCE == 's3' }}
        run: |
          set -euo pipefail
          command -v aws >/dev/null
          aws --version

      - name: Prepare writer policy evidence
        if: ${{ env.RESTORE_ARTIFACT_SOURCE == 's3' }}
        env:
          WRITER_POLICY_JSON: ${{ secrets.SHAMRAI_BACKUP_S3_WRITER_POLICY_JSON }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$RUNNER_TEMP/shamrai-s3-audit"
          umask 077
          printf '%s' "$WRITER_POLICY_JSON" > "$RUNNER_TEMP/shamrai-s3-audit/writer-policy.json"
          test -s "$RUNNER_TEMP/shamrai-s3-audit/writer-policy.json"
          chmod 0600 "$RUNNER_TEMP/shamrai-s3-audit/writer-policy.json"

      - name: Verify S3 immutability and writer scope
        if: ${{ env.RESTORE_ARTIFACT_SOURCE == 's3' }}
        shell: pwsh
        env:
          SHAMRAI_BACKUP_S3_BUCKET: ${{ vars.SHAMRAI_BACKUP_S3_BUCKET }}
          SHAMRAI_BACKUP_S3_PREFIX: ${{ vars.SHAMRAI_BACKUP_S3_PREFIX }}
          SHAMRAI_BACKUP_S3_ENDPOINT_URL: ${{ vars.SHAMRAI_BACKUP_S3_ENDPOINT_URL }}
          SHAMRAI_BACKUP_S3_STS_ENDPOINT_URL: ${{ vars.SHAMRAI_BACKUP_S3_STS_ENDPOINT_URL }}
          SHAMRAI_BACKUP_S3_REGION: ${{ vars.SHAMRAI_BACKUP_S3_REGION }}
          SHAMRAI_BACKUP_S3_AUDIT_ACCESS_KEY_ID: ${{ secrets.SHAMRAI_BACKUP_S3_AUDIT_ACCESS_KEY_ID }}
          SHAMRAI_BACKUP_S3_AUDIT_SECRET_ACCESS_KEY: ${{ secrets.SHAMRAI_BACKUP_S3_AUDIT_SECRET_ACCESS_KEY }}
          SHAMRAI_BACKUP_S3_AUDIT_SESSION_TOKEN: ${{ secrets.SHAMRAI_BACKUP_S3_AUDIT_SESSION_TOKEN }}
          SHAMRAI_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.SHAMRAI_BACKUP_S3_ACCESS_KEY_ID }}
          SHAMRAI_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.SHAMRAI_BACKUP_S3_SECRET_ACCESS_KEY }}
          SHAMRAI_BACKUP_S3_SESSION_TOKEN: ${{ secrets.SHAMRAI_BACKUP_S3_SESSION_TOKEN }}
          SHAMRAI_BACKUP_S3_WRITER_POLICY_PATH: ${{ runner.temp }}/shamrai-s3-audit/writer-policy.json
        run: ./scripts/verify-shamrai-s3-retention.ps1

      - name: Remove writer policy evidence
        if: ${{ always() && env.RESTORE_ARTIFACT_SOURCE == 's3' }}
        run: |
          rm -f "$RUNNER_TEMP/shamrai-s3-audit/writer-policy.json"
          rmdir "$RUNNER_TEMP/shamrai-s3-audit" 2>/dev/null || true

      - name: Upload S3 retention attestation
        if: ${{ env.RESTORE_ARTIFACT_SOURCE == 's3' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s3-retention-attestation-${{ github.run_id }}
          path: .deploy/s3-retention-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Run restore drill from off-host S3
        if: ${{ env.RESTORE_ARTIFACT_SOURCE == 's3' }}
        shell: pwsh
        env:
          SHAMRAI_BACKUP_S3_BUCKET: ${{ vars.SHAMRAI_BACKUP_S3_BUCKET }}
          SHAMRAI_BACKUP_S3_PREFIX: ${{ vars.SHAMRAI_BACKUP_S3_PREFIX }}
          SHAMRAI_BACKUP_S3_ENDPOINT_URL: ${{ vars.SHAMRAI_BACKUP_S3_ENDPOINT_URL }}
          SHAMRAI_BACKUP_S3_REGION: ${{ vars.SHAMRAI_BACKUP_S3_REGION }}
          SHAMRAI_BACKUP_MANIFEST_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.SHAMRAI_BACKUP_MANIFEST_SIGNING_PUBLIC_KEY_BASE64 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SHAMRAI_BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SHAMRAI_BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.SHAMRAI_BACKUP_S3_SESSION_TOKEN }}
          SHAMRAI_OFFHOST_ARTIFACT_KEY: ${{ inputs.off_host_artifact_key }}
        run: |
          ./scripts/run-shamrai-restore-drill.ps1 `
            -Workspace "$env:GITHUB_WORKSPACE" `
            -ArtifactSource S3 `
            -OffHostArtifactKey "$env:SHAMRAI_OFFHOST_ARTIFACT_KEY" `
            -SshKeyPath "$env:HOME/.ssh/shamrai_restore_drill" `
            -KnownHostsPath "$env:HOME/.ssh/known_hosts" `
            -NoHostKeyScan `
            -AgeIdentityPath "$env:RUNNER_TEMP/shamrai-backup-age-identity.txt"

      - name: Upload successful S3 restore attestation
        if: ${{ env.RESTORE_ARTIFACT_SOURCE == 's3' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s3-restore-attestation-${{ github.run_id }}
          path: .deploy/shamrai-restore-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Clean temporary secrets
        if: always()
        run: |
          rm -f "$HOME/.ssh/shamrai_restore_drill" "$RUNNER_TEMP/shamrai-backup-age-identity.txt" "$RUNNER_TEMP/shamrai-s3-audit/writer-policy.json"
          rmdir "$RUNNER_TEMP/shamrai-s3-audit" 2>/dev/null || true
