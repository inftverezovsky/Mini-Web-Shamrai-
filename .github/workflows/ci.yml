name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-audit.txt
            backend/requirements-dev.txt
            backend/requirements-dev.lock

      - name: Install dependencies
        run: |
          python ../scripts/verify-python-lock.py requirements.txt requirements.lock
          python ../scripts/verify-python-lock.py requirements-dev.txt requirements-dev.lock
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.lock --no-deps --disable-pip --strict
          pip-audit -r requirements-dev.lock --no-deps --disable-pip --strict

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile backend modules
        run: python -m compileall -q src tests alembic

  flat-coverage:
    name: Flat financial modules coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-audit.txt
            backend/requirements-dev.txt
            backend/requirements-dev.lock

      - name: Install test dependencies
        run: |
          python ../scripts/verify-python-lock.py requirements.txt requirements.lock
          python ../scripts/verify-python-lock.py requirements-dev.txt requirements-dev.lock
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Enforce flat subscription service coverage
        run: >-
          python -m pytest -q
          --cov=src.services.flat_subscriptions
          --cov-report=term-missing
          --cov-fail-under=80
          tests/test_flat_subscriptions.py
          tests/test_flat_channel_callbacks.py
          tests/test_bet_eligibility.py

      - name: Enforce immutable subscription pricing coverage
        run: >-
          python -m pytest -q
          --cov=src.services.subscription_pricing
          --cov-report=term-missing
          --cov-fail-under=80
          tests/test_payment_checkout_safety.py
          tests/test_subscription_plan_admin.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies (moderate and above)
        run: npm audit --audit-level=moderate

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run prelaunch smoke tests
        run: npm run test:e2e
        env:
          VITE_ENABLE_DEBUG_AUTH: "true"
          VITE_TELEGRAM_BOT_USERNAME: "Shamra1_bot"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks binary
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Run redacted Gitleaks history scan
        run: "$RUNNER_TEMP/gitleaks git --redact --no-banner --exit-code 1 --config .gitleaks.toml"

      - name: Run redacted Gitleaks working-tree scan
        run: "$RUNNER_TEMP/gitleaks dir --redact --no-banner --exit-code 1 --config .gitleaks.toml ."

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      ENABLE_BEARER_AUTH_COMPAT: "false"
      POSTGRES_DB: shamrai_ci
      POSTGRES_USER: shamrai_ci
      POSTGRES_PASSWORD: shamrai_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare CI env file for Compose build
        run: touch backend/.env

      - name: Build Docker images
        run: docker compose build --pull backend frontend

  alembic-smoke:
    name: PostgreSQL migration qualification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_DB: shamrai_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shamrai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Qualify fresh and pre-checkout-safety migrations
        run: python ../scripts/ci_alembic_fresh_db.py
        env:
          APP_ENV: local
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shamrai_ci
          SHAMRAI_ALLOW_CI_SCHEMA_RESET: "1"

  postgres-concurrency:
    name: PostgreSQL concurrency tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_DB: shamrai_concurrency
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shamrai_concurrency"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-audit.txt
            backend/requirements-dev.txt
            backend/requirements-dev.lock

      - name: Install test dependencies
        run: |
          python ../scripts/verify-python-lock.py requirements-dev.txt requirements-dev.lock
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Verify PostgreSQL concurrency suite is present
        run: test -f tests/test_flat_postgres_concurrency.py

      - name: Run real PostgreSQL concurrency tests
        env:
          SHAMRAI_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/shamrai_concurrency
          SHAMRAI_RUN_POSTGRES_CONCURRENCY_TESTS: "1"
        run: >-
          python -m pytest -q
          tests/test_match_access_atomicity.py
          tests/test_marketing_daily_spin.py
          tests/test_flat_postgres_concurrency.py

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      ENABLE_BEARER_AUTH_COMPAT: "false"
      POSTGRES_DB: shamrai_ci
      POSTGRES_USER: shamrai_ci
      POSTGRES_PASSWORD: shamrai_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare CI env file for Compose validation
        run: touch backend/.env

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  powershell:
    name: PowerShell syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse deploy scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Error "$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }

      - name: Validate backup ops dry-runs
        shell: pwsh
        run: |
          ./scripts/configure-shamrai-backups.ps1 -DryRun -BackupAgeRecipient age1replacewithpublicrecipient
          ./scripts/run-shamrai-restore-drill.ps1 -DryRun
          ./scripts/tests/test-backup-ops-dry-run.ps1
          ./scripts/tests/test-s3-retention-audit.ps1
          ./scripts/tests/test-release-ops.ps1
          ./scripts/tests/test-hidden-flat-e2e-gate.ps1

  release-attestation:
    name: Release qualification attestation
    runs-on: ubuntu-latest
    needs:
      - backend
      - flat-coverage
      - frontend
      - secret-scan
      - docker-build
      - alembic-smoke
      - postgres-concurrency
      - compose
      - powershell

    steps:
      - name: Create exact-SHA CI attestation
        env:
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FLAT_COVERAGE_RESULT: ${{ needs['flat-coverage'].result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SECRET_SCAN_RESULT: ${{ needs['secret-scan'].result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build'].result }}
          ALEMBIC_SMOKE_RESULT: ${{ needs['alembic-smoke'].result }}
          POSTGRES_CONCURRENCY_RESULT: ${{ needs['postgres-concurrency'].result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          POWERSHELL_RESULT: ${{ needs.powershell.result }}
        run: |
          set -euo pipefail
          mkdir -p .deploy
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re

          git_sha = os.environ["RELEASE_SHA"].lower()
          if re.fullmatch(r"[0-9a-f]{40}", git_sha) is None:
              raise SystemExit("github.sha is not a full commit SHA")

          job_results = {
              "backend": os.environ["BACKEND_RESULT"],
              "flat-coverage": os.environ["FLAT_COVERAGE_RESULT"],
              "frontend": os.environ["FRONTEND_RESULT"],
              "secret-scan": os.environ["SECRET_SCAN_RESULT"],
              "docker-build": os.environ["DOCKER_BUILD_RESULT"],
              "alembic-smoke": os.environ["ALEMBIC_SMOKE_RESULT"],
              "postgres-concurrency": os.environ["POSTGRES_CONCURRENCY_RESULT"],
              "compose": os.environ["COMPOSE_RESULT"],
              "powershell": os.environ["POWERSHELL_RESULT"],
          }
          if set(job_results.values()) != {"success"}:
              raise SystemExit("not all mandatory CI jobs succeeded")

          payload = {
              "schema_version": 1,
              "status": "passed",
              "verified_at": datetime.datetime.now(datetime.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z"),
              "git_sha": git_sha,
              "repository": os.environ["REPOSITORY"],
              "workflow": os.environ["WORKFLOW_NAME"],
              "event_name": os.environ["EVENT_NAME"],
              "ref": os.environ["RELEASE_REF"],
              "ref_protected": os.environ["REF_PROTECTED"].lower() == "true",
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "job_results": job_results,
          }
          path = pathlib.Path(".deploy/ci-release-attestation.json")
          temporary_path = path.with_suffix(".tmp")
          temporary_path.write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          temporary_path.replace(path)
          PY

      - name: Upload CI release attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-release-attestation-${{ github.sha }}
          path: .deploy/ci-release-attestation.json
          if-no-files-found: error
          retention-days: 30
