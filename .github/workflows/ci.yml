name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# BLOCKED(security): local files/history contain no verified full commit SHA, so
# mutable tags are not replaced with invented values. Pins still required for:
# actions/checkout@v7, actions/setup-python@v6, actions/setup-node@v6,
# gitleaks/gitleaks-action@v3, actions/dependency-review-action@v5.

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-audit.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile backend modules
        run: python -m compileall -q src tests alembic

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run prelaunch smoke tests
        run: npm run test:e2e
        env:
          VITE_ENABLE_DEBUG_AUTH: "true"
          VITE_TELEGRAM_BOT_USERNAME: "Shamra1_bot"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      ENABLE_BEARER_AUTH_COMPAT: "false"
      POSTGRES_DB: shamrai_ci
      POSTGRES_USER: shamrai_ci
      POSTGRES_PASSWORD: shamrai_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare CI env file for Compose build
        run: touch backend/.env

      - name: Build Docker images
        run: docker compose build --pull backend frontend

  alembic-smoke:
    name: Alembic migration smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shamrai_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shamrai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations on empty Postgres
        run: |
          alembic upgrade head
          alembic current
        env:
          APP_ENV: local
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shamrai_ci

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      ENABLE_BEARER_AUTH_COMPAT: "false"
      POSTGRES_DB: shamrai_ci
      POSTGRES_USER: shamrai_ci
      POSTGRES_PASSWORD: shamrai_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare CI env file for Compose validation
        run: touch backend/.env

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  powershell:
    name: PowerShell syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse deploy scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Error "$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }

      - name: Validate backup ops dry-runs
        shell: pwsh
        run: |
          ./scripts/configure-shamrai-backups.ps1 -DryRun -BackupAgeRecipient age1replacewithpublicrecipient
          ./scripts/run-shamrai-restore-drill.ps1 -DryRun
          ./scripts/tests/test-backup-ops-dry-run.ps1
